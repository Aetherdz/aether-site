<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 144" width="520" height="144" role="img" aria-label="Aether — terminal AI coding agent">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", "Liberation Mono", monospace; }
      .word { font-weight: 800; }
      .tag  { fill: #64748b; }
    </style>
    <linearGradient id="wgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.62" stop-color="#e2e8f0"/>
      <stop offset="0.68" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="burst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bRev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </radialGradient>
    <g id="ray">
      <path d="M70 10 L77 54 L70 64 L63 54 Z" fill="url(#burst)"/>
    </g>
    <g id="spark">
      <path d="M70 34 L82 64 L112 70 L82 76 L70 106 L58 76 L28 70 L58 64 Z" fill="url(#bRev)"/>
    </g>
  </defs>

  <!-- starburst mark (Claude-style) -->
  <use href="#ray"/>
  <use href="#ray" transform="rotate(90 70 64)"/>
  <use href="#ray" transform="rotate(180 70 64)"/>
  <use href="#ray" transform="rotate(270 70 64)"/>
  <use href="#spark"/>
  <circle cx="70" cy="64" r="9" fill="url(#core)"/>
  <circle cx="70" cy="64" r="3.4" fill="#22d3ee"/>

  <!-- wordmark -->
  <text class="mono word" x="118" y="86" font-size="52" letter-spacing="2" fill="url(#wgrad)">Aether</text>

  <!-- tagline -->
  <text class="mono tag" x="121" y="120" font-size="12.5" letter-spacing="5.5">THE MEDIUM BETWEEN STARS</text>
</svg>