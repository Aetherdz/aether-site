<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Aether emblem">
  <defs>
    <linearGradient id="acs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="acr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <g id="ray">
      <path d="M512 150 L530 402 L512 460 L494 402 Z" fill="url(#acs)"/>
    </g>
    <g id="dia">
      <path d="M322 322 L494 494 L520 486 L470 470 L348 348 Z" fill="url(#acr)" opacity="0.9"/>
      <path d="M322 322 L494 494 L486 520 L470 470 Z" fill="#22d3ee" opacity="0.35"/>
    </g>
    <g id="spark">
      <path d="M512 238 L552 458 L772 512 L552 566 L512 786 L472 566 L252 512 L472 458 Z" fill="url(#acr)"/>
    </g>
  </defs>

  <!-- panel -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#0a0a14"/>
  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#halo)"/>
  <rect x="24" y="24" width="976" height="976" rx="220" fill="none" stroke="url(#rim)" stroke-width="10" opacity="0.9"/>

  <!-- orbit rings (the medium between stars) -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <ellipse cx="512" cy="512" rx="352" ry="132" stroke="#22d3ee" opacity="0.28" transform="rotate(-18 512 512)"/>
    <ellipse cx="512" cy="512" rx="340" ry="180" stroke="#7c3aed" opacity="0.34" transform="rotate(-54 512 512)"/>
    <circle cx="512" cy="512" r="268" stroke="#a78bfa" opacity="0.18" fill="none"/>
  </g>

  <!-- orbiting bodies -->
  <circle cx="256" cy="428" r="16" fill="#22d3ee" opacity="0.9"/>
  <circle cx="764" cy="648" r="12" fill="#a78bfa" opacity="0.85"/>
  <circle cx="718" cy="352" r="8" fill="#22d3ee" opacity="0.6"/>

  <!-- background field stars -->
  <g opacity="0.5">
    <circle cx="238" cy="238" r="7" fill="#22d3ee"/>
    <circle cx="796" cy="210" r="6" fill="#7c3aed"/>
    <circle cx="852" cy="740" r="6.5" fill="#22d3ee" opacity="0.55"/>
    <circle cx="172" cy="690" r="5.5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="620" cy="164" r="4.5" fill="#22d3ee" opacity="0.5"/>
    <circle cx="384" cy="798" r="5" fill="#a78bfa" opacity="0.5"/>
  </g>

  <!-- cross sparkles (corner signals) -->
  <g stroke="#22d3ee" stroke-width="14" stroke-linecap="round" opacity="0.55">
    <line x1="330" y1="196" x2="330" y2="246"/>
    <line x1="305" y1="221" x2="355" y2="221"/>
  </g>
  <g stroke="#a78bfa" stroke-width="12" stroke-linecap="round" opacity="0.6">
    <line x1="706" y1="826" x2="706" y2="868"/>
    <line x1="685" y1="847" x2="727" y2="847"/>
  </g>

  <!-- starburst rays -->
  <use href="#ray"/>
  <use href="#ray" transform="rotate(90 512 512)"/>
  <use href="#ray" transform="rotate(180 512 512)"/>
  <use href="#ray" transform="rotate(270 512 512)"/>

  <!-- diamond orbit corners -->
  <use href="#dia"/>
  <use href="#dia" transform="rotate(90 512 512)"/>
  <use href="#dia" transform="rotate(180 512 512)"/>
  <use href="#dia" transform="rotate(270 512 512)"/>

  <!-- center spark -->
  <use href="#spark"/>
  <circle cx="512" cy="512" r="66" fill="url(#coreglow)"/>
  <circle cx="512" cy="512" r="26" fill="#0a0a14" opacity="0.55"/>
  <circle cx="512" cy="512" r="20" fill="#22d3ee"/>
  <circle cx="504" cy="500" r="7" fill="#e0f2fe" opacity="0.9"/>
</svg>