<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aether emblem">
  <defs>
    <linearGradient id="burst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="burstRev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </radialGradient>
    <g id="ray">
      <path d="M256 92 L264 216 L256 240 L248 216 Z" fill="url(#burst)"/>
    </g>
    <g id="dia">
      <path d="M150 150 L214 214 L226 208 L160 142 Z" fill="url(#burstRev)" opacity="0.92"/>
    </g>
    <g id="spark">
      <path d="M256 170 L272 240 L344 256 L272 272 L256 344 L240 272 L168 256 L240 240 Z" fill="url(#burstRev)"/>
    </g>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0a0a14" stroke="#1e293b" stroke-width="6"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#halo)"/>

  <circle cx="128" cy="148" r="5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="392" cy="134" r="4" fill="#7c3aed" opacity="0.55"/>
  <circle cx="404" cy="372" r="4.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="122" cy="358" r="3.5" fill="#22d3ee" opacity="0.4"/>
  <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="176" y1="104" x2="176" y2="120"/>
    <line x1="168" y1="112" x2="184" y2="112"/>
  </g>
  <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <line x1="352" y1="402" x2="352" y2="418"/>
    <line x1="344" y1="410" x2="360" y2="410"/>
  </g>

  <use href="#ray"/>
  <use href="#ray" transform="rotate(90 256 256)"/>
  <use href="#ray" transform="rotate(180 256 256)"/>
  <use href="#ray" transform="rotate(270 256 256)"/>
  <use href="#dia"/>
  <use href="#dia" transform="rotate(90 256 256)"/>
  <use href="#dia" transform="rotate(180 256 256)"/>
  <use href="#dia" transform="rotate(270 256 256)"/>

  <use href="#spark"/>

  <circle cx="256" cy="256" r="26" fill="url(#core)"/>
  <circle cx="256" cy="256" r="10" fill="#22d3ee"/>
